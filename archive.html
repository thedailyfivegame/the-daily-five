*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4efe4;color:#1a1a1b;min-height:100vh;}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:100;background:#f4efe4;border-bottom:1px solid #d3d6da;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;}
.nav-logo{font-family:Georgia,serif;font-size:18px;font-weight:700;text-decoration:none;color:#1a1a1b;letter-spacing:-.01em;}
.nav-links{display:flex;align-items:center;gap:20px;}
.nav-links a{font-size:13px;color:#787c7e;text-decoration:none;transition:color .15s;}
.nav-links a:hover,.nav-links a.active{color:#1a1a1b;font-weight:600;}
.nav-play{background:#1a1a1b;color:#fff !important;border-radius:6px;padding:7px 16px;font-size:13px;font-weight:600 !important;}
.nav-play:hover{background:#333 !important;}

/* ── PAGE HEADER ── */
.page-header{text-align:center;padding:48px 24px 32px;}
.page-header h1{font-family:Georgia,serif;font-size:clamp(28px,5vw,42px);font-weight:700;color:#1a1a1b;margin-bottom:10px;}
.page-header p{color:#787c7e;font-size:15px;max-width:480px;margin:0 auto;}

/* ── SEARCH & FILTER ── */
.controls{max-width:720px;margin:0 auto 24px;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;}
.search-box{flex:1;min-width:160px;display:flex;align-items:center;background:#fff;border:1.5px solid #d3d6da;border-radius:8px;padding:0 12px;gap:8px;}
.search-box input{border:none;outline:none;background:none;font-size:14px;padding:10px 0;color:#1a1a1b;width:100%;}
.search-box input::placeholder{color:#aaa;}
.filter-btn{background:#fff;border:1.5px solid #d3d6da;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;color:#1a1a1b;transition:all .15s;}
.filter-btn.active,.filter-btn:hover{background:#1a1a1b;color:#fff;border-color:#1a1a1b;}
.results-count{text-align:center;color:#787c7e;font-size:13px;margin-bottom:16px;}

/* ── ARCHIVE TABLE ── */
.archive-wrap{max-width:720px;margin:0 auto;padding:0 16px 64px;}
.archive-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);}
.archive-table thead th{background:#1a1a1b;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:12px 16px;text-align:left;}
.archive-table thead th:last-child{text-align:right;}
.archive-table tbody tr{border-bottom:1px solid #f4efe4;transition:background .1s;}
.archive-table tbody tr:hover{background:#fdf9f2;}
.archive-table tbody tr:last-child{border-bottom:none;}
.archive-table td{padding:13px 16px;font-size:14px;vertical-align:middle;}
.td-num{color:#787c7e;font-size:12px;font-weight:600;width:60px;}
.td-date{color:#4a463c;width:130px;}
.td-word{font-family:Georgia,serif;font-size:17px;font-weight:700;letter-spacing:.05em;color:#1a1a1b;}
.td-word .tiles{display:flex;gap:3px;margin-top:4px;}
.mini-tile{width:20px;height:20px;border-radius:3px;background:#538d4e;display:inline-block;}
.td-action{text-align:right;}
.practice-btn{background:transparent;border:1.5px solid #538d4e;color:#538d4e;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s;display:inline-block;}
.practice-btn:hover{background:#538d4e;color:#fff;}
.today-badge{background:#c89a2b;color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;text-transform:uppercase;letter-spacing:.05em;margin-left:6px;vertical-align:middle;}

/* ── LOAD MORE ── */
.load-more-wrap{text-align:center;margin-top:20px;}
.load-more-btn{background:#1a1a1b;color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.load-more-btn:hover{opacity:.85;}
.load-more-btn:disabled{opacity:.4;cursor:default;}

/* ── FOOTER ── */
footer{background:#1a1a1b;color:rgba(255,255,255,.5);text-align:center;padding:24px 16px;font-size:12px;}
footer a{color:rgba(255,255,255,.5);text-decoration:none;margin:0 8px;}
footer a:hover{color:#fff;}

@media(max-width:560px){
  .archive-table thead th:nth-child(2){display:none;}
  .archive-table td:nth-child(2){display:none;}
  .archive-table .td-num{width:44px;}
}

var ANSWERS = JSON.parse(decodeURIComponent(escape(atob(ANSWERS_B64))));
var EPOCH = new Date(2025,0,1).getTime();
var PAGE_SIZE = 30;
var _filtered = [];
var _shown = 0;

function todayIdx(){
  var d = new Date();
  return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - EPOCH) / 86400000);
}

function wordForDay(day){
  var n = ANSWERS.length;
  return ANSWERS[((day * 7919) % n + n) % n].toUpperCase();
}

function dateForDay(day){
  var d = new Date(EPOCH + day * 86400000);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

function buildArchive(){
  var today = todayIdx();
  var all = [];
  for(var d = today - 1; d >= 0; d--){
    all.push({ day: d, date: dateForDay(d), word: wordForDay(d) });
  }
  return all;
}

var ALL_ENTRIES = buildArchive();

function filterWords(){
  var q = document.getElementById('searchInput').value.trim().toUpperCase();
  _filtered = q ? ALL_ENTRIES.filter(e => e.word.indexOf(q) !== -1) : ALL_ENTRIES.slice();
  _shown = 0;
  document.getElementById('archiveBody').innerHTML = '';
  loadMore();
  document.getElementById('resultsCount').textContent = _filtered.length + ' puzzle' + (_filtered.length !== 1 ? 's' : '');
}

function loadMore(){
  var tbody = document.getElementById('archiveBody');
  var batch = _filtered.slice(_shown, _shown + PAGE_SIZE);
  batch.forEach(function(e){
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="td-num">#' + (e.day + 1) + '</td>' +
      '<td class="td-date">' + e.date + '</td>' +
      '<td class="td-word">' + e.word + '</td>' +
      '<td class="td-action"><a class="practice-btn" href="/play.html?practice=1&word=' + e.word.toLowerCase() + '" title="Practice ' + e.word + '">Practice</a></td>';
    tbody.appendChild(tr);
  });
  _shown += batch.length;
  var wrap = document.getElementById('loadMoreWrap');
  if (_shown < _filtered.length) {
    wrap.style.display = 'block';
    document.getElementById('loadMoreBtn').disabled = false;
  } else {
    wrap.style.display = 'none';
  }
}

// Init
filterWords();
