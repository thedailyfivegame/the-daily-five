<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rankings — The Daily Five</title>
  <meta name="description" content="Cumulative leaderboard for The Daily Five — word game, scramble and trivia."/>
  <!-- GA -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RX9TN7SJVP"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-RX9TN7SJVP');</script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4991106296689056" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
  (function(){
    var cfg={apiKey:"AIzaSyAy0iARQPIZSeE4W_Qco7ctonY_758yvvU",authDomain:"thedailyfive-f7103.firebaseapp.com",projectId:"thedailyfive-f7103",storageBucket:"thedailyfive-f7103.appspot.com"};
    try{if(!firebase.apps.length)firebase.initializeApp(cfg);window._db=firebase.firestore();}catch(e){window._db=null;}
  })();

  <style>
    :root{
      --paper:#f4efe4;--paper-2:#ede6d4;--paper-3:#e5dcc8;
      --ink:#1c1a16;--ink-soft:#4a463c;--ink-muted:#8a8070;
      --line:#cdc4ad;--green:#3f7a4f;--amber:#c89a2b;--blue:#2b5ea7;
      --accent:#9e2b25;--radius:3px;--trans:.15s ease;
    }
    [data-theme="dark"]{
      --paper:#12110e;--paper-2:#1c1a15;--paper-3:#242018;
      --ink:#f0ebe0;--ink-soft:#a39b85;--ink-muted:#6b6356;
      --line:#2e2a22;--green:#4a8f5e;--amber:#d4a830;--blue:#4a7fd4;--accent:#c0392b;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      background:var(--paper);color:var(--ink);
      font-family:'Hanken Grotesk',system-ui,sans-serif;
      min-height:100dvh;overflow-x:hidden;
      transition:background var(--trans),color var(--trans);
    }
    body::before{
      content:'';position:fixed;inset:0;
      background-image:radial-gradient(rgba(128,120,100,.04) 1px,transparent 1px);
      background-size:4px 4px;pointer-events:none;z-index:0;
    }
    *{position:relative;z-index:1;}

    /* ── Header ── */
    header{border-bottom:2px solid var(--ink);padding:8px 14px 7px;transition:border-color var(--trans);}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
    .header-center{text-align:center;flex:1;}
    .dateline{
      font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
      color:var(--ink-soft);font-weight:600;
      display:flex;justify-content:space-between;align-items:center;
      border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px;
    }
    .masthead{
      font-family:'Fraunces',serif;font-weight:900;
      font-size:clamp(22px,6vw,38px);line-height:.95;letter-spacing:-.02em;
    }
    .subhead{
      font-size:9px;letter-spacing:.28em;text-transform:uppercase;
      color:var(--ink-soft);margin-top:3px;font-weight:600;
      font-family:'Fraunces',serif;font-style:italic;
    }
    .back-btn{
      background:none;border:1.5px solid var(--line);cursor:pointer;
      color:var(--ink);font-size:13px;font-weight:600;
      padding:6px 12px;border-radius:var(--radius);
      font-family:'Hanken Grotesk',sans-serif;
      transition:background var(--trans),border-color var(--trans);
      text-decoration:none;display:inline-flex;align-items:center;gap:5px;
      white-space:nowrap;flex-shrink:0;
    }
    .back-btn:hover{background:var(--paper-2);border-color:var(--ink-soft);}
    .theme-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:6px;color:var(--ink);border-radius:var(--radius);flex-shrink:0;}

    /* ── Page ── */
    .page{max-width:680px;margin:0 auto;padding:24px 16px 48px;}

    /* ── Tabs ── */
    .tabs{display:flex;border-bottom:2px solid var(--ink);margin-bottom:22px;}
    .tab{
      flex:1;padding:10px 0;font-size:13px;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;background:none;border:none;cursor:pointer;
      color:var(--ink-muted);transition:color var(--trans),border-color var(--trans);
      border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;
    }
    .tab.active{color:var(--ink);border-bottom-color:var(--ink);}
    .tab:hover:not(.active){color:var(--ink-soft);}

    /* ── Legend ── */
    .legend{
      display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
      margin-bottom:18px;padding:9px 14px;
      background:var(--paper-2);border-radius:var(--radius);border:1px solid var(--line);
    }
    .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-soft);}
    .legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

    /* ── Month nav ── */
    .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px;}
    .month-nav button{
      background:none;border:1.5px solid var(--line);border-radius:var(--radius);
      cursor:pointer;color:var(--ink);font-size:18px;padding:4px 10px;
      transition:background var(--trans);
    }
    .month-nav button:hover{background:var(--paper-2);}
    .month-nav button:disabled{opacity:.3;cursor:default;}
    #monthLabel{font-family:'Fraunces',serif;font-weight:700;font-size:18px;min-width:140px;text-align:center;}

    /* ── Rank table ── */
    .rank-header{
      display:grid;
      grid-template-columns:36px 1fr 50px 50px 50px 58px;
      gap:0;padding:6px 10px;
      font-size:10px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--ink-muted);font-weight:700;
      border-bottom:1px solid var(--line);margin-bottom:4px;
    }
    .rank-header span{text-align:center;}
    .rank-header span:nth-child(2){text-align:left;}
    .rank-header span:last-child{text-align:right;}

    .rank-row{
      display:grid;
      grid-template-columns:36px 1fr 50px 50px 50px 58px;
      gap:0;padding:10px 10px;
      border-bottom:1px solid var(--line);
      align-items:center;transition:background var(--trans);
    }
    .rank-row:hover{background:var(--paper-2);}
    .rank-row.me{background:var(--paper-3);font-weight:700;}
    .rank-row.me .player-name{color:var(--accent);}

    .rank-num{
      font-family:'Fraunces',serif;font-weight:700;font-size:14px;
      color:var(--ink-muted);text-align:center;
    }
    .rank-num.medal{font-size:18px;color:inherit;}

    .player-name{
      font-weight:600;font-size:14px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .player-sub{font-size:10px;color:var(--ink-muted);margin-top:2px;}

    .stat-cell{text-align:center;}
    .stat-val{
      font-family:'Fraunces',serif;font-weight:700;font-size:15px;
      text-align:center;line-height:1;
    }
    .stat-val.dash{color:var(--ink-muted);font-size:13px;}
    .stat-lbl{font-size:9px;color:var(--ink-muted);text-align:center;margin-top:2px;letter-spacing:.05em;text-transform:uppercase;}

    .total-cell{text-align:right;}
    .total-val{
      font-family:'Fraunces',serif;font-weight:900;font-size:18px;
      color:var(--accent);text-align:right;line-height:1;
    }
    .total-lbl{font-size:9px;color:var(--ink-muted);text-align:right;margin-top:2px;letter-spacing:.05em;text-transform:uppercase;}

    .empty{text-align:center;padding:48px 24px;color:var(--ink-muted);font-size:15px;line-height:1.6;}
    .loading{text-align:center;padding:48px 24px;color:var(--ink-muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}

    /* ── Refresh ── */
    .refresh-row{text-align:center;margin-top:24px;}
    .refresh-btn{
      background:none;border:1.5px solid var(--line);border-radius:var(--radius);
      cursor:pointer;color:var(--ink-soft);font-size:13px;font-weight:600;
      padding:8px 20px;font-family:inherit;
      transition:background var(--trans),border-color var(--trans);
    }
    .refresh-btn:hover{background:var(--paper-2);border-color:var(--ink-soft);}
    .last-updated{font-size:11px;color:var(--ink-muted);margin-top:8px;}

    /* ── Mobile ── */
    @media(max-width:400px){
      .rank-header,.rank-row{grid-template-columns:32px 1fr 42px 42px 42px 50px;}
      .stat-val{font-size:13px;}
      .total-val{font-size:15px;}
      .player-name{font-size:13px;}
    }
  </style>

  <meta property="og:title" content="Rankings — The Daily Five"/>
  <meta property="og:description" content="Cumulative leaderboard for The Daily Five — word game, scramble and trivia."/>
  <meta property="og:url" content="https://www.thedailyfive.net/leaderboard.html"/>
  <meta property="og:image" content="https://www.thedailyfive.net/og-image.png"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Rankings — The Daily Five"/>
  <meta name="twitter:description" content="Cumulative leaderboard for The Daily Five — word game, scramble and trivia."/>

</head>
<body>
<header>
  <div class="dateline">
    <span id="headerDate"></span>
    <span>Rankings</span>
    <span>Est. 2024</span>
  </div>
  <div class="header-top">
    <a class="back-btn" href="index.html">&#8592; Home</a>
    <div class="header-center">
      <div class="masthead">The Daily Five</div>
      <div class="subhead">Leaderboard</div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>

<div class="page">
  <div class="tabs">
    <button class="tab active" id="tabMonthly" onclick="showTab('monthly')">📅 Monthly</button>
    <button class="tab" id="tabAlltime" onclick="showTab('alltime')">🌍 All-time</button>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--green)"></div>Word Game
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--blue)"></div>Scramble
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--amber)"></div>Trivia
    </div>
  </div>

  <div class="month-nav" id="monthNav">
    <button id="prevMonthBtn" onclick="changeMonth(-1)">‹</button>
    <div id="monthLabel">Loading…</div>
    <button id="nextMonthBtn" onclick="changeMonth(1)" disabled>›</button>
  </div>

  <div class="rank-header">
    <span></span>
    <span>Player</span>
    <span style="color:var(--green)">Word</span>
    <span style="color:var(--blue)">Scrm</span>
    <span style="color:var(--amber)">Triv</span>
    <span style="text-align:right">Score</span>
  </div>

  <div id="rankList"><div class="loading">Loading…</div></div>

  <div class="refresh-row">
    <button class="refresh-btn" onclick="loadRankings()">↻ Refresh</button>
    <div class="last-updated" id="lastUpdated"></div>
  </div>
</div>

<script>
var MEDALS = ['🥇','🥈','🥉'];
var S = {
  get: function(k){ try{return localStorage.getItem(k);}catch(e){return null;} },
  set: function(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
};

// ── Theme ──
(function(){
  var t = S.get('df_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
})();
document.getElementById('themeBtn').onclick = function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  S.set('df_theme', next);
  this.textContent = next === 'dark' ? '☀️' : '🌙';
};

// ── Header date ──
(function(){
  var d = new Date();
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mos = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('headerDate').textContent = days[d.getDay()]+', '+mos[d.getMonth()]+' '+d.getDate();
})();

// ── State ──
var today = new Date();
var viewYear = today.getFullYear();
var viewMonth = today.getMonth();
var currentTab = 'monthly';
var EPOCH = new Date('2025-01-01T00:00:00');

function dayIdx(date){
  return Math.floor((date.getTime() - EPOCH.getTime()) / 86400000);
}

var MOS_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function changeMonth(dir){
  viewMonth += dir;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  updateMonthNav();
  loadRankings();
}

function updateMonthNav(){
  document.getElementById('monthLabel').textContent = MOS_NAMES[viewMonth]+' '+viewYear;
  var isCurrent = (viewYear === today.getFullYear() && viewMonth === today.getMonth());
  document.getElementById('nextMonthBtn').disabled = isCurrent;
}

function showTab(t){
  currentTab = t;
  document.getElementById('tabMonthly').classList.toggle('active', t === 'monthly');
  document.getElementById('tabAlltime').classList.toggle('active', t === 'alltime');
  document.getElementById('monthNav').style.display = t === 'monthly' ? '' : 'none';
  loadRankings();
}

function slugify(name){
  return (name||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
}

function getMySlug(){
  return slugify(S.get('df_lb_name')||'');
}

function fmt(n){
  return n > 0 ? n : '<span class="dash">—</span>';
}

// ── Load all 3 collections ──
function loadRankings(){
  if(!window._db){
    document.getElementById('rankList').innerHTML = '<div class="empty">Leaderboard unavailable.</div>';
    return;
  }
  document.getElementById('rankList').innerHTML = '<div class="loading">Loading…</div>';
  document.getElementById('lastUpdated').textContent = '';

  var queries;
  if(currentTab === 'monthly'){
    var startDay = dayIdx(new Date(viewYear, viewMonth, 1));
    var endDay = dayIdx(new Date(viewYear, viewMonth + 1, 0));
    queries = [
      window._db.collection('scores').where('day','>=',startDay).where('day','<=',endDay).limit(2000).get(),
      window._db.collection('scramble_scores').where('day','>=',startDay).where('day','<=',endDay).limit(2000).get(),
      window._db.collection('trivia_scores').where('day','>=',startDay).where('day','<=',endDay).limit(2000).get()
    ];
  } else {
    queries = [
      window._db.collection('scores').limit(5000).get(),
      window._db.collection('scramble_scores').limit(5000).get(),
      window._db.collection('trivia_scores').limit(5000).get()
    ];
  }

  Promise.allSettled(queries).then(function(results){
    var wordSnap = results[0].status==='fulfilled'?results[0].value:{docs:[]};
    var scramSnap = results[1].status==='fulfilled'?results[1].value:{docs:[]};
    var trivSnap = results[2].status==='fulfilled'?results[2].value:{docs:[]};
    var players = {};

    function ensure(slug, name){
      if(!players[slug]) players[slug] = {name: name || slug, word:0, scram:0, triv:0};
    }

    wordSnap.docs.forEach(function(doc){
      var d = doc.data();
      if(!d.won || !d.name) return;
      var sl = slugify(d.name); if(!sl) return;
      ensure(sl, d.name);
      players[sl].word++;
    });

    scramSnap.docs.forEach(function(doc){
      var d = doc.data();
      if(!d.won || !d.name) return;
      var sl = slugify(d.name); if(!sl) return;
      ensure(sl, d.name);
      players[sl].scram++;
    });

    trivSnap.docs.forEach(function(doc){
      var d = doc.data();
      if(!d.correct || !d.name) return;
      var sl = slugify(d.name); if(!sl) return;
      ensure(sl, d.name);
      players[sl].triv++;
    });

    var sorted = Object.keys(players).map(function(sl){
      var p = players[sl];
      return {slug:sl, name:p.name, word:p.word, scram:p.scram, triv:p.triv, total:p.word+p.scram+p.triv};
    }).filter(function(p){ return p.total > 0; });

    sorted.sort(function(a,b){
      if(b.total !== a.total) return b.total - a.total;
      if(b.word !== a.word) return b.word - a.word;
      if(b.scram !== a.scram) return b.scram - a.scram;
      return b.triv - a.triv;
    });

    if(sorted.length === 0){
      var period = currentTab === 'monthly' ? MOS_NAMES[viewMonth]+' '+viewYear : 'all time';
      document.getElementById('rankList').innerHTML =
        '<div class="empty">No scores yet for '+period+'.<br>Play all three games to appear here! 🎯</div>';
      return;
    }

    var mySlug = getMySlug();
    var html = '';

    sorted.forEach(function(p, i){
      var isMe = mySlug && p.slug === mySlug;
      var rankCell = i < 3
        ? '<div class="rank-num medal">'+MEDALS[i]+'</div>'
        : '<div class="rank-num">'+(i+1)+'</div>';
      var sub = [];
      if(p.word > 0) sub.push(p.word+' word');
      if(p.scram > 0) sub.push(p.scram+' scramble');
      if(p.triv > 0) sub.push(p.triv+' trivia');
      html +=
        '<div class="rank-row'+(isMe?' me':'')+'">' +
          rankCell +
          '<div>' +
            '<div class="player-name">'+(p.name||'Anonymous')+'</div>' +
            '<div class="player-sub">'+sub.join(' · ')+'</div>' +
          '</div>' +
          '<div class="stat-cell">' +
            '<div class="stat-val" style="color:var(--green)">'+fmt(p.word)+'</div>' +
          '</div>' +
          '<div class="stat-cell">' +
            '<div class="stat-val" style="color:var(--blue)">'+fmt(p.scram)+'</div>' +
          '</div>' +
          '<div class="stat-cell">' +
            '<div class="stat-val" style="color:var(--amber)">'+fmt(p.triv)+'</div>' +
          '</div>' +
          '<div class="total-cell">' +
            '<div class="total-val">'+(p.total)+'</div>' +
            '<div class="total-lbl">pts</div>' +
          '</div>' +
        '</div>'
    });

    document.getElementById('rankList').innerHTML = html;
    document.getElementById('lastUpdated').textContent = 'Updated '+new Date().toLocaleTimeString();

    if(mySlug){
      setTimeout(function(){
        var me = document.querySelector('#rankList .rank-row.me');
        if(me) me.scrollIntoView({behavior:'smooth', block:'nearest'});
      }, 100);
    }

  }).catch(function(e){
    document.getElementById('rankList').innerHTML =
      '<div class="empty">Could not load rankings.<br><small>'+e.message+'</small></div>';
  });
}

// ── Init ──
updateMonthNav();
loadRankings();
</script>
</body>
</html>
