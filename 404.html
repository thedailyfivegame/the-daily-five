<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Page Not Found — The Daily Five</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4efe4; --ink: #1c1a16; --ink-soft: #4a463c; --ink-muted: #8a8070;
  --line: #cdc4ad; --green: #3f7a4f; --green-dim: #2c5638; --accent: #9e2b25;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: 'Hanken Grotesk', system-ui, sans-serif;
  background-image: radial-gradient(rgba(28,26,22,.025) 1px, transparent 1px);
  background-size: 4px 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100dvh; text-align: center; padding: 24px;
}
.tiles {
  display: flex; gap: 6px; justify-content: center; margin-bottom: 32px;
}
.tile {
  width: 56px; height: 56px;
  border: 2px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif; font-weight: 700; font-size: 28px;
  color: var(--ink); border-radius: 2px;
}
.tile.g { background: #3f7a4f; border-color: #3f7a4f; color: #fff; }
.tile.a { background: #a39b85; border-color: #a39b85; color: #fff; }
.kicker {
  font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--accent); font-weight: 700; margin-bottom: 14px;
}
h1 {
  font-family: 'Fraunces', serif; font-weight: 900;
  font-size: clamp(36px, 10vw, 64px); line-height: .95; letter-spacing: -.03em;
  margin-bottom: 16px;
}
p {
  font-size: 15px; color: var(--ink-soft); line-height: 1.6;
  max-width: 360px; margin: 0 auto 32px;
}
.btn {
  background: var(--green); color: #fff; text-decoration: none;
  padding: 14px 30px; border-radius: 4px; font-weight: 800; font-size: 13px;
  text-transform: uppercase; letter-spacing: .06em;
  box-shadow: 0 4px 0 var(--green-dim);
  display: inline-block; transition: transform .05s, box-shadow .05s;
  margin: 6px;
}
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn-ghost {
  color: var(--ink); text-decoration: none; font-weight: 700;
  font-size: 13px; border-bottom: 2px solid var(--ink); padding-bottom: 2px;
  margin: 6px 12px; display: inline-block;
}
</style>
</head>
<body>

<div class="tiles">
  <div class="tile a">4</div>
  <div class="tile g">0</div>
  <div class="tile a">4</div>
</div>

<p class="kicker">Page Not Found</p>
<h1>That word<br>isn't in<br>our list.</h1>
<p>This page doesn't exist — but a new five-letter word is waiting for you every day.</p>

<div>
  <a class="btn" href="play.html">Play Today's Word</a>
  <a class="btn-ghost" href="/">Go Home</a>
</div>

</body>
</html>
